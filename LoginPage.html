<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - 3alemni</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
    <link rel="stylesheet" href="LoginPage.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/logo.jpg" type="image/png">
</head>
<body>
    <header class="header">
        <a href="#" class="logo"> 
            <img src="images/logo.jpg" alt="Logo" class="logo-img"> 
            3alemni
        </a>
        <nav class="navbar">
            <a href="#home">home</a>
            <a href="#about">about</a>
            <a href="#centers">centers</a>
            <a href="#teachers">teachers</a>
            <a href="#contact">contact</a>
            <a href="SignupPage.html" class="btn">Register</a>
        </nav>
        <div class="fas fa-bars" id="menu"></div>
    </header>
    
    <main>
        <div class="form-container">
            <h1 class="title" style="text-align: center; margin-left: -13%; font-size: 4rem;"> <b>Welcome back!</b> access and continue your journey.  </h1>
            
            <form id="loginForm" style="margin-top: 10%; margin-left: 10%;">
                <div class="input-group">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email"  placeholder="Email" required>
                </div>
                <div class="input-group" style="margin-top: 5%;">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" placeholder="Password" required>
                   
                </div>
                <button type="submit" class="btn" style="margin-left: 33%; text-align: center; padding: 0.75rem 1rem;">Login</button>
            </form>
            <p class="signup-text" style="margin-left: -5%;" >Don’t have an Account? <a href="SignupPage.html">Sign Up</a> </p> 
            <p class="ForgetPassword-text" style="margin-left: -5%;">Forgot your Password? <a href="ForgetPasswordPage.html">Forget Password</a></p>
        </div>
        <div class="image-container">
            <img src="images/Computer login-amico.png" alt="Login illustration">
        </div>
    </main>
    <script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    // Get email and password
    const email = this.querySelector('input[type="email"]').value.trim();
    const password = this.querySelector('input[type="password"]').value.trim();

    // Optional: basic validation
    if (!email || !password) {
        alert('Please fill in both fields.');
        return;
    }

    try {
        const response = await fetch('http://localhost:3001/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!data.success) {
            alert(data.error || 'Login failed.');
            return;
        }

        // Redirect based on role
        switch (data.role) {
            case 'admin':
                window.location.href = 'AdminDashboard.html';
                break;
            case 'teacher':
                window.location.href = 'TeacherDashboard_Overview.html';
                break;
            case 'student':
                window.location.href = 'StudentDashboard_Overview.html';
                break;
            default:
                alert('Unknown role.');
        }

    } catch (error) {
        console.error(error);
        alert('An error occurred while logging in.');
    }
});
</script>

</body>
</html>
