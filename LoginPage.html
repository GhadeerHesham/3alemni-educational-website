<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - 3alemni</title>
    <link rel="stylesheet" href="LoginPage.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <h1>LOGIN</h1>
        <img src="images/logo.jpg" alt="Login Illustration" class="illustration">
        <form id="loginForm">
            <div class="input-group">
                <i class="fas fa-user icon"></i>
                <input type="email" placeholder="Email" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock icon"></i>
                <input type="password" placeholder="Password" required>
                <i class="fas fa-eye icon visibility"></i>
            </div>
            <button type="submit">LOGIN</button>
        </form>
        <p class="signup-text">Don’t have an Account? <a href="SignUpPage.html">Sign Up</a></p>
    </div>
</body>
</html>
