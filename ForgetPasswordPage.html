<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - 3alemni</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
    />
    <link rel="stylesheet" href="ForgetPasswordPage.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="images/logo.jpg" type="image/png" />
  </head>
  <body>
    <header class="header">
      <a href="#" class="logo">
        <img src="images/logo.jpg" alt="Logo" class="logo-img" />
        3alemni
      </a>
      <nav class="navbar">
        <a href="#home">home</a>
        <a href="#about">about</a>
        <a href="#centers">centers</a>
        <a href="#teachers">teachers</a>
        <a href="#contact">contact</a>
        <a href="SignupPage.html" class="btn">Register</a>
      </nav>
      <div class="fas fa-bars" id="menu"></div>
    </header>

    <main>
      <div class="form-container">
        <h1 class="title">Forgot Password</h1>

        <p class="instruction-text">Enter your email to reset your password</p>
        <form id="forgotPasswordForm">
          <div class="input-group">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" placeholder="Email" required />
          </div>
          <a
            href="#"
            class="btn"
            style="
              margin-left: 35%;
              text-align: center;
              padding: 0.75rem 1rem;
              margin-top: 3%;
            "
            >Reset Password</a
          >
        </form>
      </div>
      <div class="image-container">
        <img
          src="images/Forgot password-bro.png"
          alt="Forgot Password illustration"
        />
      </div>
    </main>

    <script>
      document
        .getElementById("forgotPasswordForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          alert("Password reset link sent!");
          window.location.href = "LoginPage.html"; // Redirect to login page
        });
    </script>
  </body>
</html>
