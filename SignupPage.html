<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - 3alemni</title>
    <link rel="stylesheet" href="SignUpPage.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="signup-container">
        <h1>SIGN UP</h1>
        <img src="assets/login_illustration.png" alt="Sign Up Illustration" class="illustration">
        <form id="signupForm">
            <div class="input-group">
                <i class="fas fa-user icon"></i>
                <input type="text" placeholder="Name" required>
            </div>
            <div class="input-group">
                <i class="fas fa-envelope icon"></i>
                <input type="email" placeholder="Email" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock icon"></i>
                <input type="password" placeholder="Password" required>
                <i class="fas fa-eye icon visibility"></i>
            </div>
            <div class="input-group">
                <i class="fas fa-user-tag icon"></i>
                <select required>
                    <option value="" disabled selected>Select Role</option>
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                    <option value="assistant">Assistant</option>
                </select>
            </div>
            <button type="submit">SIGN UP</button>
        </form>
        <p class="login-text">Already have an Account? <a href="LoginPage.html">Login</a></p>
    </div>
</body>
</html>
