<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3alemni | Sign Up</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="SignupPage.css" />
    <link rel="icon" href="images/logo.jpg" type="image/png" />
  </head>
  <body>
    <header class="header">
      <a href="#" class="logo">
        <img src="images/logo.jpg" alt="Logo" class="logo-img" />
        3alemni
      </a>
      <nav class="navbar">
        <a href="HomePageBeforeRegister.html">home</a>
        <a href="#about">about</a>
        <a href="centers.html">centers</a>
        <a href="teachers.html">teachers</a>
        <a href="#">contact</a>
        
      </nav>
      <div class="fas fa-bars" id="menu"></div>
    </header>

    <main>
      <div class="form-container">
        <h1 class="title" style="margin-top: 7%">
          <i>Begin Your Educational Adventure,<br /><b>Sign Up Now!</b></i>
        </h1>
        <form id="signupForm" style="margin-top: 2%">
          <div class="form-row">
            <div class="input-group">
              <i class="fas fa-user input-icon"></i>
              <input type="text" name="firstName" placeholder="First Name" required />
            </div>
            <div class="input-group">
              <i class="fas fa-user input-icon"></i>
              <input type="text" name="lastName" placeholder="Last Name" required />
            </div>
          </div>
          <div class="input-group">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" name="email" placeholder="Email" required />
          </div>
          <div class="input-group">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" name="password" placeholder="Password" required />
          </div>
          <div class="input-group">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" name="confirmPassword" placeholder="Confirm Password" required />
          </div>
          <div class="input-group">
            <i class="fas fa-school input-icon"></i>
            <select id="roleSelect" name="role" required>
              <option value="">Loading roles...</option>
            </select>
            <i class="fas fa-chevron-down dropdown-icon"></i>
          </div>
          <button type="submit" class="btn signup-btn">SIGN UP</button>
        </form>
      </div>
      <div class="image-container">
        <img src="images/Sign up-amico.png" alt="Sign up illustration" />
      </div>
    </main>

    <script>
      const roles = ["student", "admin", "teacher", "assistant", "parent"];
      // Get the select element
const roleSelect = document.getElementById('roleSelect');

// Clear the loading message
roleSelect.innerHTML = '';

// Add a default empty option (optional)
const defaultOption = document.createElement('option');
defaultOption.value = '';
defaultOption.textContent = 'Select a role...';
roleSelect.appendChild(defaultOption);

// Add each role as an option
roles.forEach(role => {
  const option = document.createElement('option');
  option.value = role;
  option.textContent = role.charAt(0).toUpperCase() + role.slice(1); // Capitalize first letter
  roleSelect.appendChild(option);
});

// Make the field required
roleSelect.required = true;

      // Handle form submission
      document.getElementById('signupForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const formData = {
          firstName: this.firstName.value.trim(),
          lastName: this.lastName.value.trim(),
          email: this.email.value.trim(),
          password: this.password.value,
          confirmPassword: this.confirmPassword.value,
          role: this.role.value
        };

        if (formData.password !== formData.confirmPassword) {
          alert('Passwords do not match!');
          return;
        }

        try {
          const res = await fetch('http://localhost:3001/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
          });

          const data = await res.json();
          if (res.ok) {
            if (roleSelect.value === 'student') {
              window.location.href = 'StudentDashboard_Overview.html';
            }
            else if (roleSelect.value === 'teacher') {
              window.location.href = 'TeacherDashboard_Overview.html';
            }
            else if (roleSelect.value === 'admin') {
              window.location.href = 'AdminDashboard.html';
            }
          } else {
            alert(data.error || 'Failed to sign up.');
          }
        } catch (err) {
          console.error('Signup error:', err);
          alert('Server error. Try again later.');
        }
      });
    </script>
  </body>
</html>
