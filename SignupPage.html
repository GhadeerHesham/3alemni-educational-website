<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3alemni | Sign Up</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="SignupPage.css" />
    <link rel="icon" href="images/logo.jpg" type="image/png" />
  </head>
  <body>
    <header class="header">
      <a href="#" class="logo">
        <img src="images/logo.jpg" alt="Logo" class="logo-img" />
        3alemni
      </a>
      <nav class="navbar">
        <a href="HomePageBeforeRegister.html">home</a>
        <a href="#about">about</a>
        <a href="centers.html">centers</a>
        <a href="teachers.html">teachers</a>
        <a href="#">contact</a>
        <a href="LoginPage.html" class="btn">Register</a>
      </nav>
      <div class="fas fa-bars" id="menu"></div>
    </header>

    <main>
      <div class="form-container">
        <h1 class="title" style="margin-top: 7%">
          <i>Begin Your Educational Adventure,<br /><b>Sign Up Now!</b></i>
        </h1>
        <form id="signupForm" style="margin-top: 2%">
          <div class="form-row">
            <div class="input-group">
              <i class="fas fa-user input-icon"></i>
              <input type="text" placeholder="First Name" required />
            </div>
            <div class="input-group">
              <i class="fas fa-user input-icon"></i>
              <input type="text" placeholder="Last Name" required />
            </div>
          </div>
          <div class="input-group">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" placeholder="Email" required />
          </div>
          <div class="input-group">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" placeholder="Password" required />
          </div>
          <div class="input-group">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" placeholder="Confirm Password" required />
          </div>
          <div class="input-group">
            <i class="fas fa-school input-icon"></i>
            <select id="roleSelect" required>
              <option value="">Select Role</option>
              <option value="Student">Student</option>
              <option value="Teacher">Teacher</option>
              <option value="Assistant">Assistant</option>
            </select>
            <i class="fas fa-chevron-down dropdown-icon"></i>
          </div>
          <button type="submit" class="btn signup-btn">SIGN UP</button>
        </form>
      </div>
      <div class="image-container">
        <img src="images/Sign up-amico.png" alt="Sign up illustration" />
      </div>
    </main>
    <script src="script.js"></script>
    <script src="SignupPage.js"></script>
  </body>
</html>
